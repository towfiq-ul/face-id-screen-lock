[project]
name = "facelock"
version = "0.1.0"
description = "Webcam-based auto-lock daemon: locks the screen when the enrolled face is gone for too long"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
facelock-enroll = "facelock.cli:enroll_main"
facelock-monitor = "facelock.cli:monitor_main"
facelock-gui = "facelock.cli:gui_main"
facelock-calibrate = "facelock.cli:calibrate_main"
facelock-test = "facelock.cli:test_main"
facelock-remove = "facelock.cli:remove_main"
facelock-auth = "facelock.cli:auth_main"
facelock-pam = "facelock.cli:pam_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["facelock*"]

[tool.setuptools.package-data]
facelock = ["assets/*"]

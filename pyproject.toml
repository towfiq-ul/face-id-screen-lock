[project]
name = "facelock"
version = "0.1.0"
description = "Webcam-based auto-lock daemon: locks the screen when the enrolled face is gone for too long"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.scripts]
facelock-enroll = "facelock.cli:enroll_main"
facelock-monitor = "facelock.cli:monitor_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["facelock*"]
